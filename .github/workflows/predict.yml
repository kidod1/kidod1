# 매시간 바이낸스 예측을 실행해 텔레그램으로 전송하는 워크플로.
#
# 사용 전 준비 (GitHub 저장소 → Settings → Secrets and variables → Actions):
#   - Secret  TELEGRAM_BOT_TOKEN : @BotFather 에게 받은 봇 토큰
#   - Secret  TELEGRAM_CHAT_ID   : 봇에게 /start 를 보내면 알려주는 chat id
#
# 심볼/간격을 바꾸려면 아래 run 단계의 --symbols / --interval 을 수정하세요.
# Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능합니다.

name: Prediction report

on:
  schedule:
    # 5분마다 종합 리포트 (예측 + 지지/저항 + 타이밍 판단).
    # 주의: GitHub 스케줄은 혼잡 시 몇 분 지연되거나 일부 회차가 건너뛰어질 수 있음.
    # 알림이 너무 잦으면 "*/15 * * * *" (15분) 또는 "5 * * * *" (매시간) 으로 바꾸세요.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

env:
  SYMBOLS: BTCUSDT ETHUSDT SOLUSDT XRPUSDT BNBUSDT

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send full report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # GitHub 러너는 대부분 미국 IP라 api.binance.com이 451로 차단됨.
          # 공개 시세 전용 미러 엔드포인트를 사용한다.
          BINANCE_BASE_URL: https://data-api.binance.vision
        run: python notify.py --symbols $SYMBOLS --interval 1h --report
