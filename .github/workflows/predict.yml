# 지지/저항 돌파 감지 알림 워크플로.
#
# 가능한 한 자주(5분 cron) 실행을 시도하지만, GitHub 스케줄은 혼잡 시
# 1시간 이상 지연될 수 있음. 상태 파일(.breakout_state.json)에 마지막 검사
# 캔들을 기록해두므로 실행 간격이 불규칙해도 돌파를 놓치거나 중복 알림하지 않음
# (최대 12캔들 전까지 소급 검사).
#
# 필요한 Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

name: Breakout alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# 상태 파일 커밋을 위한 쓰기 권한 + 동시 실행 방지
permissions:
  contents: write
concurrency:
  group: breakout-alerts
  cancel-in-progress: false

env:
  SYMBOLS: BTCUSDT ETHUSDT SOLUSDT XRPUSDT BNBUSDT

jobs:
  breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect breakouts and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # GitHub 러너는 대부분 미국 IP라 api.binance.com이 451로 차단됨.
          BINANCE_BASE_URL: https://data-api.binance.vision
        run: python breakout_notify.py --symbols $SYMBOLS --interval 1h

      - name: Save state (prevents duplicate alerts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .breakout_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update breakout state [skip ci]"
            git pull --rebase origin main
            git push
          fi
